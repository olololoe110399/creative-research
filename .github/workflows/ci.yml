name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync project
        run: uv sync --all-groups

      - name: Critical lint
        run: uv run ruff check .

      - name: Check static JavaScript
        run: |
          node --check src/creative_research/showcase_static/app.js
          node --check src/creative_research/reference_workspace_static/app.js

      - name: Test
        run: uv run pytest --cov=creative_research --cov-report=term-missing

      - name: Build package
        run: uv build

      - name: Verify static assets in wheel
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          required = {
              "creative_research/showcase_static/index.html",
              "creative_research/showcase_static/app.js",
              "creative_research/showcase_static/style.css",
              "creative_research/showcase_static/favicon.svg",
              "creative_research/reference_workspace_static/index.html",
              "creative_research/reference_workspace_static/app.js",
              "creative_research/reference_workspace_static/style.css",
              "creative_research/reference_workspace_static/favicon.svg",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing showcase assets in wheel: " + ", ".join(missing))
          print("Static assets packaged:", ", ".join(sorted(required)))
          PY
