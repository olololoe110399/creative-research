[project]
name = "creative-research"
version = "1.0.0"
description = "Reusable evidence pipeline for public creative and distribution research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "apify-client>=3.2.1,<4",
  "google-genai>=2.28.0,<3",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "pyarrow>=18.0.0",
  "pydantic>=2.9.0",
  "yt-dlp>=2025.1.0",
]

[project.scripts]
creative-research = "creative_research.cli.app:main"

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creative_research"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/scripts", "/docs", "/config/*.example.*",
  "/README.md", "/AGENTS.md", "/CONTRIBUTING.md",
  "/SECURITY.md", "/LICENSE", "/Makefile", "/pyproject.toml", "/uv.lock",
  "/.env.example", "/.gitignore", "/.python-version", "/.github/workflows/ci.yml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "N", "B", "A", "C4"]

[tool.mypy]
files = ["src/creative_research"]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["creative_research"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
